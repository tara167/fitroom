<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 148" role="img" aria-label="Fit Room Pilates &amp; Training Studios">

  <!-- FIT (lime green) -->
  <text x="8" y="82" font-family="Arial Black, 'Arial Bold', sans-serif" font-size="78" font-weight="900" fill="#7C8C5E">FIT</text>

  <!-- Heartbeat pulse graphic -->
  <polyline
    points="196,68  208,68  213,68  219,44  226,92  233,54  240,68  258,68"
    fill="none" stroke="#7C8C5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ROOM (charcoal) -->
  <text x="254" y="82" font-family="Arial Black, 'Arial Bold', sans-serif" font-size="78" font-weight="900" fill="#4A4438">ROOM</text>

  <!-- Dotted underline -->
  <line x1="8" y1="94" x2="472" y2="94" stroke="#7C8C5E" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round"/>

  <!-- PILATES & TRAINING STUDIOS -->
  <text x="240" y="118" font-family="Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="3.5" fill="#4A4438" text-anchor="middle">PILATES &amp; TRAINING STUDIOS</text>

  <!-- Santa Teresa -->
  <text x="240" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#7C8C5E" text-anchor="middle">Santa Teresa</text>

</svg>
